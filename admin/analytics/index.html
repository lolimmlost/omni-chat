<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omni-Chat Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 2rem;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    h1 {
      color: #00d9ff;
    }
    .back-link {
      color: #888;
      text-decoration: none;
    }
    .back-link:hover {
      color: #fff;
    }
    .auth-screen {
      max-width: 300px;
      margin: 4rem auto;
      text-align: center;
    }
    .auth-screen input {
      width: 100%;
      padding: 0.75rem;
      margin: 1rem 0;
      border: 1px solid #333;
      border-radius: 6px;
      background: #12121f;
      color: #eee;
    }
    .auth-screen button {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      background: #00d9ff;
      color: #1a1a2e;
      font-weight: bold;
      cursor: pointer;
    }
    .error {
      color: #ff4757;
      margin-top: 0.5rem;
    }
    .hidden { display: none !important; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: #12121f;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      border: 1px solid #333;
    }
    .stat-value {
      font-size: 2.5rem;
      font-weight: bold;
      color: #00d9ff;
    }
    .stat-label {
      color: #888;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    .stat-card.warning .stat-value {
      color: #ffa502;
    }
    .stat-card.success .stat-value {
      color: #2ed573;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 900px) {
      .charts-grid {
        grid-template-columns: 1fr;
      }
    }
    .chart-card {
      background: #12121f;
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid #333;
    }
    .chart-card h3 {
      margin-bottom: 1rem;
      color: #888;
      font-size: 0.9rem;
      text-transform: uppercase;
    }
    .chart-container {
      position: relative;
      height: 250px;
    }

    .refresh-btn {
      padding: 0.5rem 1rem;
      border: 1px solid #00d9ff;
      border-radius: 6px;
      background: transparent;
      color: #00d9ff;
      cursor: pointer;
      margin-left: 1rem;
    }
    .refresh-btn:hover {
      background: rgba(0, 217, 255, 0.1);
    }
  </style>
</head>
<body>
  <div id="auth-screen" class="auth-screen">
    <h2>Analytics</h2>
    <p>Enter admin token</p>
    <input type="password" id="token-input" placeholder="Admin token" autofocus>
    <button id="auth-btn">Login</button>
    <p id="auth-error" class="error"></p>
  </div>

  <div id="dashboard" class="hidden">
    <div class="header">
      <div>
        <h1>Chat Analytics</h1>
        <a href="/admin/" class="back-link">Back to Dashboard</a>
      </div>
      <button id="refresh-btn" class="refresh-btn">Refresh Data</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-today">0</div>
        <div class="stat-label">Sessions Today</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Total Sessions</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-messages">0</div>
        <div class="stat-label">Total Messages</div>
      </div>
      <div class="stat-card warning">
        <div class="stat-value" id="stat-waiting">0</div>
        <div class="stat-label">Currently Waiting</div>
      </div>
      <div class="stat-card success">
        <div class="stat-value" id="stat-rating">N/A</div>
        <div class="stat-label">Avg Rating</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-response">0s</div>
        <div class="stat-label">Avg Response Time</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <h3>Sessions (Last 7 Days)</h3>
        <div class="chart-container">
          <canvas id="sessions-chart"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <h3>Current Status</h3>
        <div class="chart-container">
          <canvas id="status-chart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let sessionsChart, statusChart;

    const authScreen = document.getElementById('auth-screen');
    const dashboard = document.getElementById('dashboard');
    const tokenInput = document.getElementById('token-input');
    const authBtn = document.getElementById('auth-btn');
    const authError = document.getElementById('auth-error');
    const refreshBtn = document.getElementById('refresh-btn');

    authBtn.addEventListener('click', authenticate);
    tokenInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') authenticate();
    });
    refreshBtn.addEventListener('click', loadAnalytics);

    function authenticate() {
      const token = tokenInput.value.trim();
      if (!token) return;

      socket.emit('admin:auth', { token }, (response) => {
        if (response.success) {
          authScreen.classList.add('hidden');
          dashboard.classList.remove('hidden');
          initCharts();
          loadAnalytics();
        } else {
          authError.textContent = response.error || 'Authentication failed';
        }
      });
    }

    function loadAnalytics() {
      socket.emit('admin:get-analytics', (response) => {
        if (response.data) {
          updateStats(response.data);
          updateCharts(response.data);
        }
      });
    }

    function updateStats(data) {
      document.getElementById('stat-today').textContent = data.todaySessions || 0;
      document.getElementById('stat-total').textContent = data.totalSessions || 0;
      document.getElementById('stat-messages').textContent = data.totalMessages || 0;
      document.getElementById('stat-waiting').textContent = data.currentWaiting || 0;
      document.getElementById('stat-rating').textContent = data.avgRating || 'N/A';

      const responseTime = data.avgResponseTimeMs || 0;
      if (responseTime > 60000) {
        document.getElementById('stat-response').textContent = Math.round(responseTime / 60000) + 'm';
      } else {
        document.getElementById('stat-response').textContent = Math.round(responseTime / 1000) + 's';
      }
    }

    function initCharts() {
      const chartColors = {
        cyan: '#00d9ff',
        purple: '#7c3aed',
        green: '#2ed573',
        orange: '#ffa502',
        red: '#ff4757',
        gray: '#666'
      };

      // Sessions chart
      const sessionsCtx = document.getElementById('sessions-chart').getContext('2d');
      sessionsChart = new Chart(sessionsCtx, {
        type: 'bar',
        data: {
          labels: [],
          datasets: [{
            label: 'Sessions',
            data: [],
            backgroundColor: chartColors.cyan,
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { color: '#888' },
              grid: { color: '#333' }
            },
            x: {
              ticks: { color: '#888' },
              grid: { display: false }
            }
          }
        }
      });

      // Status chart
      const statusCtx = document.getElementById('status-chart').getContext('2d');
      statusChart = new Chart(statusCtx, {
        type: 'doughnut',
        data: {
          labels: ['Active', 'Waiting', 'Closed'],
          datasets: [{
            data: [0, 0, 0],
            backgroundColor: [chartColors.green, chartColors.orange, chartColors.gray],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#888' }
            }
          }
        }
      });
    }

    function updateCharts(data) {
      // Sessions chart
      const sessionsData = data.sessionsPerDay || [];
      sessionsChart.data.labels = sessionsData.map(d => d.date.slice(5)); // MM-DD
      sessionsChart.data.datasets[0].data = sessionsData.map(d => d.sessions);
      sessionsChart.update();

      // Status chart
      statusChart.data.datasets[0].data = [
        data.currentActive || 0,
        data.currentWaiting || 0,
        data.recentlyClosed || 0
      ];
      statusChart.update();
    }

    // Auto-refresh every 30 seconds
    setInterval(() => {
      if (!dashboard.classList.contains('hidden')) {
        loadAnalytics();
      }
    }, 30000);
  </script>
</body>
</html>
